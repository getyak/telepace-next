name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: telepace
          POSTGRES_PASSWORD: telepace
          POSTGRES_DB: telepace
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telepace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install deps
        run: uv sync --extra dev --frozen
      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python_files=()
          while IFS= read -r file; do
            python_files+=("$file")
          done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.py')
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed Python files."
          else
            uv run ruff check "${python_files[@]}"
          fi
      - name: Typecheck
        run: uv run mypy core harness agents storage interfaces || true
      - name: Test backend (external API e2e runs separately)
        env:
          TELEPACE_DATABASE_URL: postgresql://telepace:telepace@localhost:5432/telepace
          TELEPACE_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q --ignore=tests/e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: bash scripts/design-guard.sh
      - run: pnpm typecheck
      - run: pnpm check:tokens
      - run: pnpm test
      - run: pnpm build
