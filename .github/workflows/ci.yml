name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: telepace
          POSTGRES_PASSWORD: telepace
          POSTGRES_DB: telepace_test_mcp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U telepace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install deps
        run: uv sync --extra dev --frozen
      - name: Lint changed Python files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python_files=()
          while IFS= read -r file; do
            python_files+=("$file")
          done < <(git diff --name-only --diff-filter=ACMR "$BASE_SHA...$HEAD_SHA" -- '*.py')
          if (( ${#python_files[@]} == 0 )); then
            echo "No changed Python files."
          else
            uv run ruff check "${python_files[@]}"
          fi
      - name: Typecheck
        run: uv run mypy core harness agents storage interfaces || true
      - name: Test backend (external API e2e runs separately)
        env:
          TELEPACE_DATABASE_URL: postgresql://telepace:telepace@localhost:5432/telepace_test_mcp
          TELEPACE_TEST_DATABASE_URL: postgresql://telepace:telepace@localhost:5432/telepace_test_mcp
          TELEPACE_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest -q --ignore=tests/e2e
      - name: Run Eval scoreboard
        run: >-
          uv run python -m eval.ci.scoreboard
          --out "$RUNNER_TEMP/scoreboard.md"
          --fail-under 10.5
      - name: Preserve Eval scoreboard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: eval-scoreboard-${{ github.run_id }}
          path: ${{ runner.temp }}/scoreboard.md
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.2"
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 9.14.0
      - run: pnpm install --frozen-lockfile
      - name: Audit dependencies with verified local mitigation
        env:
          DEPENDENCY_AUDIT_REPORT: ${{ runner.temp }}/frontend-audit-raw.json
        run: pnpm audit:security
      - name: Preserve raw dependency audit
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/frontend-audit-raw.json
          if-no-files-found: error
          retention-days: 30
      - run: pnpm lint
      - run: bash scripts/design-guard.sh
      - run: pnpm typecheck
      - run: pnpm check:tokens
      - run: pnpm test
      - run: pnpm build
